<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Speed Shear Competitor Entry</title>
  <meta property="og:title" content="Speed Shear Competitor Entry">
  <meta property="og:description" content="Open the competition entry form to enter a Speed Shear competition.">
  <style>body{margin:0;font-family:Segoe UI,system-ui,-apple-system,Arial,sans-serif;background:#f4f4f4;color:#111}.card{max-width:560px;margin:12vh auto;background:#fff;border:1px solid #ddd;border-top:6px solid #EB1D27;border-radius:14px;padding:24px;box-shadow:0 3px 14px rgba(0,0,0,.08)}h1{font-size:22px;margin:0 0 8px}p{line-height:1.5;color:#555}</style>
</head>
<body>
  <main class="card">
    <h1>Opening competitor entry…</h1>
    <p id="status">Please wait while we open the competition entry form.</p>
  </main>
  <script>
    (() => {
      const code = (new URLSearchParams(location.search).get('c') || '').trim().toLowerCase();
      const status = document.getElementById('status');
      if (!/^[a-f0-9]{20}$/.test(code)) {
        status.textContent = 'This competitor entry link is incomplete or invalid.';
        return;
      }
      location.replace(`enter/?c=${encodeURIComponent(code)}`);
    })();
  </script>
</body>
</html>
