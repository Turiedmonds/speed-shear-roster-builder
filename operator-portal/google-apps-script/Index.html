<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      font-family: Arial, sans-serif;
      color: #17202a;
      background: #f4f6f7;
      --ws-red: #EB1D27;
      --ws-danger: #a11212;
      --ws-line: #d8d8d8;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f6f7; }
    .shell { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .header { margin-bottom: 18px; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: #667085; }
    h1 { margin: 5px 0 6px; font-size: 28px; }
    .muted { color: #667085; font-size: 14px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0; }

    input, select, button, a.button {
      min-height: 42px;
      border-radius: 8px;
      border: 1px solid #cfd4dc;
      font: inherit;
    }

    input { flex: 1 1 260px; padding: 0 12px; background: #fff; }
    select { padding: 0 10px; background: #fff; }

    button, a.button {
      padding: 0 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #17202a;
      font-weight: 700;
    }

    button:disabled { opacity: .55; cursor: wait; }
    a.primary { background: #17202a; color: #fff; border-color: #17202a; }
    button.danger { color: #a11212; border-color: #d6a3a3; }
    button.delete { background: #a11212; color: #fff; border-color: #a11212; }
    .summary { margin: 12px 0 18px; font-weight: 700; }
    .grid { display: grid; gap: 14px; }

    .card {
      background: #fff;
      border: 1px solid #e1e5ea;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }

    .card.cancelled { border-color: #d6a3a3; background: #fffafa; }
    .card-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .card h2 { margin: 0 0 5px; font-size: 21px; }
    .date { font-weight: 700; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .badge { padding: 5px 8px; border-radius: 999px; background: #eef1f4; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .badge.paid { background: #e8f5ec; }
    .badge.cancelled { background: #f7dede; color: #851111; }

    .details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px 16px;
      margin: 14px 0;
    }

    .label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #667085; margin-bottom: 3px; }
    .value { font-size: 14px; word-break: break-word; }
    .counts { display: flex; gap: 16px; flex-wrap: wrap; margin: 12px 0; }
    .count strong { font-size: 22px; display: block; }
    .grade-list { display: flex; gap: 7px; flex-wrap: wrap; margin: 12px 0; }
    .grade { background: #f7f8fa; border-radius: 7px; padding: 6px 8px; font-size: 12px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .operator-actions { border-top: 1px solid #e6e8eb; padding-top: 12px; margin-top: 12px; }
    .operator-title { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #667085; margin-bottom: 8px; font-weight: 700; }
    .empty, .error, .loading, .notice { background: #fff; padding: 18px; border-radius: 10px; border: 1px solid #e1e5ea; }
    .error { color: #9b1c1c; }
    .notice { margin-bottom: 12px; }

    /* Uniform Waimarino Shears modal styling. */
    .ws-dialog {
      border: 0;
      padding: 0;
      background: transparent;
      color: #171717;
      width: min(540px, calc(100vw - 28px));
      max-width: 540px;
    }

    .ws-dialog::backdrop { background: rgba(0,0,0,.58); }

    .ws-dialog-card {
      background: #fff;
      border: 1px solid var(--ws-line);
      border-top: 7px solid var(--ws-red);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 24px 70px rgba(0,0,0,.30);
    }

    .ws-dialog-eyebrow {
      margin: 0 0 6px;
      color: var(--ws-red);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .ws-dialog-title { margin: 0; font-size: 24px; line-height: 1.18; }
    .ws-dialog-message { margin: 14px 0 0; color: #333; line-height: 1.5; white-space: pre-line; }

    .ws-dialog-detail {
      margin: 12px 0 0;
      padding: 11px 12px;
      border-left: 4px solid var(--ws-red);
      border-radius: 8px;
      background: #fff6f6;
      color: #4b2a2c;
      line-height: 1.45;
      white-space: pre-line;
    }

    .ws-dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #ececec;
    }

    .ws-dialog-button {
      min-height: 42px;
      border-radius: 9px;
      padding: 9px 15px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .ws-dialog-cancel { border: 1px solid #888; background: #fff; color: #222; }
    .ws-dialog-confirm { border: 1px solid #111; background: #111; color: #fff; }
    .ws-dialog[data-tone="danger"] .ws-dialog-confirm { border-color: var(--ws-danger); background: var(--ws-danger); }
    .ws-dialog[data-tone="warning"] .ws-dialog-confirm { border-color: var(--ws-red); background: var(--ws-red); }

    @media (max-width: 600px) {
      .shell { padding: 14px; }
      .card-head { display: block; }
      .badges { justify-content: flex-start; margin-top: 10px; }
      .actions a.button, .actions button { width: 100%; }
      .ws-dialog-card { padding: 18px; }
      .ws-dialog-title { font-size: 21px; }
      .ws-dialog-actions { display: grid; grid-template-columns: 1fr; }
      .ws-dialog-button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="header">
      <div class="eyebrow">WAIMARINO SHEARS</div>
      <h1>System Operator Portal</h1>
      <div class="muted">Private Waimarino Shears control page for Speed Shear competitions.</div>
    </div>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Search competition, venue, reference or organiser">
      <select id="status">
        <option value="active">Active competitions</option>
        <option value="Today">Today</option>
        <option value="Upcoming">Upcoming</option>
        <option value="Past">Past</option>
        <option value="cancelled">Cancelled</option>
        <option value="all">All competitions</option>
      </select>
      <button type="button" onclick="loadCompetitions()">Refresh</button>
    </div>

    <div id="message"></div>
    <div id="summary" class="summary"></div>
    <div id="content" class="loading">Loading competitions…</div>
  </main>

  <dialog id="operatorConfirmDialog" class="ws-dialog" aria-labelledby="operatorConfirmTitle" aria-describedby="operatorConfirmMessage">
    <div class="ws-dialog-card">
      <p class="ws-dialog-eyebrow">Waimarino Shears</p>
      <h2 id="operatorConfirmTitle" class="ws-dialog-title">Confirm action</h2>
      <div id="operatorConfirmMessage" class="ws-dialog-message"></div>
      <div id="operatorConfirmDetail" class="ws-dialog-detail" hidden></div>
      <div class="ws-dialog-actions">
        <button id="operatorConfirmCancel" class="ws-dialog-button ws-dialog-cancel" type="button">Cancel</button>
        <button id="operatorConfirmOk" class="ws-dialog-button ws-dialog-confirm" type="button">Continue</button>
      </div>
    </div>
  </dialog>

  <script>
    let allCompetitions = [];
    let actionBusy = false;

    document.getElementById('search').addEventListener('input', render);
    document.getElementById('status').addEventListener('change', render);

    function loadCompetitions(message) {
      document.getElementById('content').className = 'loading';
      document.getElementById('content').textContent = 'Loading competitions…';
      document.getElementById('summary').textContent = '';
      if (message) showMessage(message, false);

      google.script.run
        .withSuccessHandler(function (result) {
          allCompetitions = result.competitions || [];
          actionBusy = false;
          render();
        })
        .withFailureHandler(showFailure)
        .getOperatorCompetitions();
    }

    function render() {
      const search = document.getElementById('search').value.trim().toLowerCase();
      const status = document.getElementById('status').value;
      const filtered = allCompetitions.filter(function (item) {
        if (status === 'active' && item.operatorStatus !== 'active') return false;
        if (status === 'cancelled' && item.operatorStatus !== 'cancelled') return false;
        if ((status === 'Today' || status === 'Upcoming' || status === 'Past') && (item.operatorStatus !== 'active' || item.lifecycle !== status)) return false;
        if (!search) return true;
        return [
          item.name,
          item.venue,
          item.bookingReference,
          item.organiser && item.organiser.name,
          item.organiser && item.organiser.email,
          item.organiser && item.organiser.phone
        ].join(' ').toLowerCase().includes(search);
      });

      document.getElementById('summary').textContent = filtered.length + ' competition' + (filtered.length === 1 ? '' : 's');
      const content = document.getElementById('content');

      if (!filtered.length) {
        content.className = 'empty';
        content.textContent = allCompetitions.length ? 'No competitions match that filter.' : 'No competition records were found.';
        return;
      }

      content.className = 'grid';
      content.innerHTML = filtered.map(cardHtml).join('');
    }

    function cardHtml(item) {
      const organiser = item.organiser || {};
      const isCancelled = item.operatorStatus === 'cancelled';
      const grades = (item.grades || []).map(function (grade) {
        let text = escapeHtml(grade.name) + ': ' + grade.count;
        if (grade.limit != null && grade.limit !== '') text += ' / ' + grade.limit;
        if (grade.submitted) text += ' · submitted';
        return '<span class="grade">' + text + '</span>';
      }).join('');

      const managerButton = item.entryManagerUrl
        ? '<a class="button primary" target="_blank" rel="noopener" href="' + escapeAttr(item.entryManagerUrl) + '">Open Entry Manager</a>'
        : '';
      const publicButton = item.competitorEntryUrl
        ? '<a class="button" target="_blank" rel="noopener" href="' + escapeAttr(item.competitorEntryUrl) + '">Open Public Entry</a>'
        : '';

      const depositButton = item.depositStatus === 'paid'
        ? actionButton('Mark Awaiting Deposit', 'setDeposit', item.bookingReference, 'awaiting')
        : actionButton('Mark Deposit Paid', 'setDeposit', item.bookingReference, 'paid');

      const operatorButtons = isCancelled
        ? actionButton('Restore Competition', 'restoreCompetition', item.bookingReference) +
          actionButton('Delete Permanently', 'deleteCompetition', item.bookingReference, '', 'delete')
        : depositButton +
          actionButton('Cancel Competition', 'cancelCompetition', item.bookingReference, '', 'danger');

      return '<section class="card' + (isCancelled ? ' cancelled' : '') + '">' +
        '<div class="card-head">' +
          '<div><h2>' + escapeHtml(item.name) + '</h2><div class="date">' + escapeHtml(formatDate(item.date)) + '</div></div>' +
          '<div class="badges">' +
            '<span class="badge' + (isCancelled ? ' cancelled' : '') + '">' + escapeHtml(item.operatorStatusLabel) + '</span>' +
            '<span class="badge' + (item.depositStatus === 'paid' ? ' paid' : '') + '">' + escapeHtml(item.depositStatusLabel) + '</span>' +
            '<span class="badge">' + escapeHtml(item.lifecycle) + '</span>' +
            '<span class="badge">Entries ' + escapeHtml(item.publicEntriesLabel) + '</span>' +
            '<span class="badge">Roster ' + escapeHtml(item.rosterStatus) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="details">' +
          detail('Venue', item.venue || '—') +
          detail('Booking Reference', item.bookingReference || '—') +
          detail('Organiser', organiser.name || '—') +
          detail('Email', organiser.email || '—') +
          detail('Phone', organiser.phone || '—') +
        '</div>' +
        '<div class="counts">' +
          countBlock(item.totalEntries, 'Total entries') +
          countBlock(item.confirmedEntries, 'Confirmed') +
          countBlock(item.notConfirmedEntries, 'Not confirmed') +
        '</div>' +
        (grades ? '<div class="grade-list">' + grades + '</div>' : '') +
        (!isCancelled ? '<div class="actions">' + managerButton + publicButton + '</div>' : '') +
        '<div class="operator-actions"><div class="operator-title">Operator controls</div><div class="actions">' + operatorButtons + '</div></div>' +
      '</section>';
    }

    function actionButton(label, action, reference, value, cssClass) {
      return '<button type="button" class="' + escapeAttr(cssClass || '') + '" ' + (actionBusy ? 'disabled ' : '') +
        'onclick="operatorAction(\'' + escapeJs(reference) + '\',\'' + escapeJs(action) + '\',\'' + escapeJs(value || '') + '\')">' + escapeHtml(label) + '</button>';
    }

    function operatorConfirmation(action) {
      if (action === 'cancelCompetition') {
        return showOperatorConfirm({
          title: 'Cancel this competition?',
          message: 'This will immediately block both the private Entry Manager link and the public competitor-entry link.',
          detail: 'You can restore the competition later if the cancellation is reversed.',
          confirmLabel: 'Cancel Competition',
          cancelLabel: 'Keep Competition',
          tone: 'danger'
        });
      }

      if (action === 'restoreCompetition') {
        return showOperatorConfirm({
          title: 'Restore this competition?',
          message: 'The existing Entry Manager and public competitor-entry links will become available again.',
          confirmLabel: 'Restore Competition',
          cancelLabel: 'Keep Cancelled',
          tone: 'default'
        });
      }

      if (action === 'deleteCompetition') {
        return showOperatorConfirm({
          title: 'Permanently delete this competition?',
          message: 'This moves the central competition record to Google Drive Trash and removes it from the Operator Portal.',
          detail: 'The old Entry Manager and public entry links will remain blocked. This action cannot be undone from the portal.',
          confirmLabel: 'Delete Permanently',
          cancelLabel: 'Keep Competition',
          tone: 'danger'
        });
      }

      return Promise.resolve(true);
    }

    function showOperatorConfirm(options) {
      const dialog = document.getElementById('operatorConfirmDialog');
      const title = document.getElementById('operatorConfirmTitle');
      const message = document.getElementById('operatorConfirmMessage');
      const detail = document.getElementById('operatorConfirmDetail');
      const cancel = document.getElementById('operatorConfirmCancel');
      const confirm = document.getElementById('operatorConfirmOk');

      title.textContent = options.title || 'Confirm action';
      message.textContent = options.message || '';
      detail.textContent = options.detail || '';
      detail.hidden = !options.detail;
      cancel.textContent = options.cancelLabel || 'Cancel';
      confirm.textContent = options.confirmLabel || 'Continue';
      dialog.dataset.tone = options.tone || 'default';

      return new Promise(resolve => {
        let settled = false;

        function cleanup() {
          cancel.removeEventListener('click', cancelClick);
          confirm.removeEventListener('click', confirmClick);
          dialog.removeEventListener('cancel', dialogCancel);
          dialog.removeEventListener('click', backdropClick);
        }

        function finish(value) {
          if (settled) return;
          settled = true;
          cleanup();
          if (dialog.open) dialog.close();
          resolve(value);
        }

        function cancelClick() { finish(false); }
        function confirmClick() { finish(true); }
        function dialogCancel(event) { event.preventDefault(); finish(false); }
        function backdropClick(event) { if (event.target === dialog) finish(false); }

        cancel.addEventListener('click', cancelClick);
        confirm.addEventListener('click', confirmClick);
        dialog.addEventListener('cancel', dialogCancel);
        dialog.addEventListener('click', backdropClick);
        dialog.showModal();
        window.setTimeout(() => cancel.focus(), 0);
      });
    }

    async function operatorAction(reference, action, value) {
      if (actionBusy) return;

      const confirmed = await operatorConfirmation(action);
      if (!confirmed) return;

      actionBusy = true;
      render();
      showMessage('Updating competition…', false);

      const runner = google.script.run
        .withSuccessHandler(function () {
          const messages = {
            setDeposit: value === 'paid' ? 'Deposit marked as paid.' : 'Deposit marked as awaiting payment.',
            cancelCompetition: 'Competition cancelled.',
            restoreCompetition: 'Competition restored.',
            deleteCompetition: 'Competition deleted.'
          };
          loadCompetitions(messages[action] || 'Competition updated.');
        })
        .withFailureHandler(showFailure);

      if (action === 'setDeposit') runner.setOperatorDepositStatus(reference, value);
      else if (action === 'cancelCompetition') runner.cancelOperatorCompetition(reference);
      else if (action === 'restoreCompetition') runner.restoreOperatorCompetition(reference);
      else if (action === 'deleteCompetition') runner.deleteOperatorCompetition(reference);
    }

    function showFailure(error) {
      actionBusy = false;
      showMessage(error && error.message ? error.message : 'Unable to update the competition.', true);
      render();
    }

    function showMessage(text, isError) {
      const box = document.getElementById('message');
      if (!text) {
        box.innerHTML = '';
        return;
      }
      box.innerHTML = '<div class="' + (isError ? 'error' : 'notice') + '">' + escapeHtml(text) + '</div>';
    }

    function detail(label, value) {
      return '<div><span class="label">' + escapeHtml(label) + '</span><span class="value">' + escapeHtml(value) + '</span></div>';
    }

    function countBlock(value, label) {
      return '<div class="count"><strong>' + Number(value || 0) + '</strong><span class="muted">' + escapeHtml(label) + '</span></div>';
    }

    function formatDate(value) {
      if (!value) return 'Date not set';
      const parts = value.split('-');
      if (parts.length !== 3) return value;
      const date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      return new Intl.DateTimeFormat('en-NZ', { day: 'numeric', month: 'long', year: 'numeric' }).format(date);
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttr(value) { return escapeHtml(value); }
    function escapeJs(value) { return String(value == null ? '' : value).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

    loadCompetitions();
  </script>
</body>
</html>
