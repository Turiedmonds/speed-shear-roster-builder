<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Speed Shear Entry Manager</title>
  <style>body{margin:0;font-family:Segoe UI,system-ui,-apple-system,Arial,sans-serif;background:#f4f4f4;color:#111}.card{max-width:560px;margin:12vh auto;background:#fff;border:1px solid #ddd;border-top:6px solid #EB1D27;border-radius:14px;padding:24px;box-shadow:0 3px 14px rgba(0,0,0,.08)}h1{font-size:22px;margin:0 0 8px}p{line-height:1.5;color:#555}</style>
</head>
<body>
  <main class="card">
    <h1>Opening Entry Manager…</h1>
    <p id="status">Please wait while we open this competition.</p>
  </main>
  <script>
    (() => {
      const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwOkoKs3Is6bSumWYe71zH2mOEZ4h0YhY-PO2JPiea2WClMs6kIMjzYtEZmqg3MlgQC-w/exec';
      const code = new URLSearchParams(location.search).get('c') || '';
      const status = document.getElementById('status');
      if (!code) {
        status.textContent = 'This Entry Manager link is incomplete.';
        return;
      }
      fetch(`${ENDPOINT}?action=resolve-manager-code&code=${encodeURIComponent(code)}`, { cache: 'no-store' })
        .then(response => response.json())
        .then(result => {
          if (!result || result.ok !== true || !result.token) throw new Error(result && result.error || 'Entry Manager link not found.');
          location.replace(`entry-manager.html?access=${encodeURIComponent(result.token)}`);
        })
        .catch(error => {
          status.textContent = error && error.message ? error.message : 'This Entry Manager link could not be opened.';
        });
    })();
  </script>
</body>
</html>
