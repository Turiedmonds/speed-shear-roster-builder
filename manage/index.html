<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Speed Shear Entry Manager</title>
  <style>
    html,body{margin:0;width:100%;height:100%;font-family:Segoe UI,system-ui,-apple-system,Arial,sans-serif;background:#f4f4f4;color:#111}
    .loading-card{max-width:560px;margin:12vh auto;background:#fff;border:1px solid #ddd;border-top:6px solid #EB1D27;border-radius:14px;padding:24px;box-shadow:0 3px 14px rgba(0,0,0,.08)}
    .loading-card h1{font-size:22px;margin:0 0 8px}.loading-card p{line-height:1.5;color:#555;margin:0}
    #managerFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f4f4}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main id="loadingCard" class="loading-card">
    <h1>Opening Entry Manager…</h1>
    <p id="status">Please wait while we open the correct competition.</p>
  </main>
  <iframe id="managerFrame" title="Speed Shear Entry Manager" hidden></iframe>

  <script>
    (() => {
      const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwOkoKs3Is6bSumWYe71zH2mOEZ4h0YhY-PO2JPiea2WClMs6kIMjzYtEZmqg3MlgQC-w/exec';
      const code = (new URLSearchParams(location.search).get('c') || '').trim().toLowerCase();
      const status = document.getElementById('status');
      const loadingCard = document.getElementById('loadingCard');
      const frame = document.getElementById('managerFrame');
      const CACHE_KEY = code ? `waimarinoSpeedShearManagerResolved_${code}` : '';

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('../entry-manager-sw.js', { scope: '/' }).catch(() => undefined);
      }

      if (!/^[a-f0-9]{20}$/.test(code)) {
        status.textContent = 'This Entry Manager link is incomplete or invalid.';
        return;
      }

      function readCachedToken() {
        try {
          const saved = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
          return saved && typeof saved.token === 'string' && saved.token.trim() ? saved.token.trim() : '';
        } catch (_) {
          return '';
        }
      }

      function saveCachedToken(token) {
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify({ token, cachedAt: new Date().toISOString() }));
        } catch (_) {}
      }

      function clearCachedToken() {
        try { localStorage.removeItem(CACHE_KEY); } catch (_) {}
      }

      function openManager(token, offlineFallback) {
        frame.addEventListener('load', () => {
          loadingCard.hidden = true;
          frame.hidden = false;
        }, { once: true });

        const offline = offlineFallback ? '&offline=1' : '';
        frame.src = `../entry-manager.html?access=${encodeURIComponent(token)}${offline}`;
      }

      function openCachedOrExplain() {
        const token = readCachedToken();
        if (!token) {
          status.textContent = 'This competition has not been saved on this device yet. Reconnect to the internet and open the Entry Manager once before using it offline.';
          return;
        }
        status.textContent = 'Opening the saved Entry Manager in offline mode…';
        openManager(token, true);
      }

      if (navigator.onLine === false) {
        openCachedOrExplain();
        return;
      }

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 6000);

      fetch(`${ENDPOINT}?action=resolve-manager-code&code=${encodeURIComponent(code)}`, {
        cache: 'no-store',
        signal: controller.signal
      })
        .then(response => response.json())
        .then(result => {
          clearTimeout(timer);
          if (!result || result.ok !== true || !result.token) {
            clearCachedToken();
            const error = new Error(result && result.error || 'This Entry Manager link could not be found.');
            error.resolverRejected = true;
            throw error;
          }

          saveCachedToken(result.token);
          openManager(result.token, false);
        })
        .catch(error => {
          clearTimeout(timer);
          if (error && error.resolverRejected) {
            status.textContent = error.message;
            return;
          }
          openCachedOrExplain();
        });
    })();
  </script>
</body>
</html>
